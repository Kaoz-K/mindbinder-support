name: 💡 Feature request
description: Suggest an idea or improvement for MindBinder
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Have an idea that would make MindBinder better? We'd love to hear it.
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the situation where you miss this feature.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: What would you like to see?
      description: Describe the feature or improvement you have in mind.
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      description: Where would this matter most?
      multiple: true
      options:
        - Mac
        - iPhone
        - iPad
        - All platforms
  - type: textarea
    id: alternatives
    attributes:
      label: Workarounds or alternatives
      description: Anything you do today to work around this?
