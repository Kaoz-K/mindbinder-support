name: 🐞 Bug report
description: Something in MindBinder isn't working as expected
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill in what you can — the more detail, the faster we can fix it.
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      description: Where does the bug happen?
      multiple: true
      options:
        - Mac
        - iPhone
        - iPad
    validations:
      required: true
  - type: input
    id: app-version
    attributes:
      label: App version
      description: Found in Settings → About (e.g. 1.2.0)
      placeholder: "1.2.0"
    validations:
      required: true
  - type: input
    id: os-version
    attributes:
      label: OS version
      placeholder: "e.g. macOS 15.5 / iOS 18.4"
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a project
        2. Tap …
        3. See error
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: Drag & drop images here if they help explain the problem.
  - type: checkboxes
    id: sync
    attributes:
      label: Sync
      options:
        - label: I have iCloud Sync enabled
